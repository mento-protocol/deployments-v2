name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trunk:
    name: Trunk Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Third-party actions are SHA-pinned (not tag-pinned) so upstream tag
      # retargeting or a compromised release cannot silently run new code here.
      # Bumps are proposed by Dependabot (see .github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trunk Check
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1

  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: stable

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install mento-core dependencies
        run: cd lib/mento-core && npm install --ignore-scripts

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv --no-match-path "test/integration/*"
        id: test

      # Fail if .treb/deployments.json is ahead of the generated contracts
      # package for any already-published namespace (issue #77). Reuses the
      # out/ artifacts built above — the generator reads ABIs from there.
      - name: Check contracts-package namespace drift
        run: pnpm contracts:check-drift
        id: drift
