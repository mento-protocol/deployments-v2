# CodeRabbit is retired. Disable automatic reviews and replies.
# Remove the organization app installation; Global overrides can supersede this file.
reviews:
  review_status: false
  profile: chill

  request_changes_workflow: false

  poem: false
  sequence_diagrams: false
  suggested_labels: false
  suggested_reviewers: false
  auto_apply_labels: false
  collapse_walkthrough: true
  changed_files_summary: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false

  path_filters:
    - "!pnpm-lock.yaml"
    - "!**/pnpm-lock.yaml"
    - "!packages/contracts/package-lock.json"
    - "!foundry.lock"
    - "!packages/contracts/abis/**"
    - "!broadcast/**/*.json"

  auto_review:
    enabled: false
    base_branches: []
    drafts: false
    auto_incremental_review: false
    auto_pause_after_reviewed_commits: 5

chat:
  auto_reply: false
